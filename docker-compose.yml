version: '3.9'

services:
  roach1:
    image: cockroachdb/cockroach:latest
    container_name: roach1
    hostname: roach1
    command: start --insecure --listen-addr=roach1:26357 --sql-addr=roach1:26257 --http-addr=roach1:8080 --join=roach1:26357,roach2:26357,roach3:26357
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - roach1_data:/cockroach/cockroach-data
    networks:
      - roachnet

  roach2:
    image: cockroachdb/cockroach:latest
    container_name: roach2
    hostname: roach2
    command: start --insecure --listen-addr=roach2:26357 --sql-addr=roach2:26257 --http-addr=roach2:8080 --join=roach1:26357,roach2:26357,roach3:26357
    ports:
      - "26258:26257"
      - "8081:8080"
    volumes:
      - roach2_data:/cockroach/cockroach-data
    networks:
      - roachnet

  roach3:
    image: cockroachdb/cockroach:latest
    container_name: roach3
    hostname: roach3
    command: start --insecure --listen-addr=roach3:26357 --sql-addr=roach3:26257 --http-addr=roach3:8080 --join=roach1:26357,roach2:26357,roach3:26357
    ports:
      - "26259:26257"
      - "8082:8080"
    volumes:
      - roach3_data:/cockroach/cockroach-data
    networks:
      - roachnet

  cluster-init:
    image: cockroachdb/cockroach:latest
    container_name: roach-init
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        ./cockroach init --insecure --host=roach1:26357 || true
    depends_on:
      - roach1
      - roach2
      - roach3
    networks:
      - roachnet

volumes:
  roach1_data:
  roach2_data:
  roach3_data:

networks:
  roachnet:
    driver: bridge
